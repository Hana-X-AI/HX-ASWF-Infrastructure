<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui,'Segoe UI',sans-serif">
  <style>
    .bg{fill:#0a0f1a}
    .card{fill:#111b2f;stroke:#243654;stroke-width:1.5}
    .name{fill:#edf3ff;font-size:18px;font-weight:600}
    .role{fill:#55d6ff;font-size:13.5px}
    .head{fill:#edf3ff;font-size:20px;font-weight:700;text-anchor:middle}
    .sub{fill:#9aabc5;font-size:13.5px;text-anchor:middle}
    .title{fill:#edf3ff;font-size:26px;font-weight:700;text-anchor:middle}
    .link{stroke:#243654;stroke-width:2;fill:none}
    .chip{fill:#0d1526;stroke:#243654;stroke-width:1.5}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .f0{animation:fade .5s ease both}
    .f1{animation:fade .5s ease .12s both}
    .f2{animation:fade .5s ease .20s both}
    .f3{animation:fade .5s ease .28s both}
    .f4{animation:fade .5s ease .36s both}
    .f5{animation:fade .5s ease .44s both}
    .f6{animation:fade .5s ease .52s both}
    .f7{animation:fade .5s ease .60s both}
    .f8{animation:fade .5s ease .68s both}
    .f9{animation:fade .5s ease .76s both}
    .f10{animation:fade .5s ease .84s both}
    .l1{animation:fade .6s ease .30s both}
    .l2{animation:fade .6s ease .30s both}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
  </style>
  <rect class="bg" width="1200" height="640"/>
  <text class="title" x="600" y="48">Two classes, one roster</text>
  <text class="sub" x="600" y="72">Technology experts do the work. Cross-cutting roles hold the process.</text>

  <!-- coordinator -->
  <g class="f0">
    <rect class="card" x="490" y="98" width="220" height="58" rx="12"/>
    <text class="name" x="600" y="124">Xavier</text>
    <text class="role" x="600" y="144">coordinator · routes + gates</text>
  </g>
  <path class="link l1" d="M600 156 L320 196"/>
  <path class="link l2" d="M600 156 L880 196"/>

  <!-- left column: technology experts -->
  <text class="head" x="320" y="224">Technology experts</text>
  <text class="sub" x="320" y="244">one per technology, grounded on its source</text>
  <g class="f1"><rect class="card" x="180" y="262" width="280" height="52" rx="12"/><text class="name" x="200" y="284">Craig</text><text class="role" x="200" y="304">Ollama · local runtime</text></g>
  <g class="f2"><rect class="card" x="180" y="322" width="280" height="52" rx="12"/><text class="name" x="200" y="344">Ledger</text><text class="role" x="200" y="364">PostgreSQL · data</text></g>
  <g class="f3"><rect class="card" x="180" y="382" width="280" height="52" rx="12"/><text class="name" x="200" y="404">Quincy</text><text class="role" x="200" y="424">Qwen · models</text></g>
  <g class="f4"><rect class="card" x="180" y="442" width="280" height="52" rx="12"/><text class="name" x="200" y="464">Owen</text><text class="role" x="200" y="484">systems · Ubuntu + NVIDIA</text></g>
  <g class="f5"><rect class="card" x="180" y="502" width="280" height="52" rx="12"/><text class="name" x="200" y="524">Athena</text><text class="role" x="200" y="544">LightRAG · retrieval</text></g>
  <g class="f6"><rect class="chip" x="180" y="564" width="280" height="40" rx="10"/><text class="sub" x="320" y="589">… one per technology in the stack</text></g>

  <!-- right column: cross-cutting roles -->
  <text class="head" x="880" y="224">Cross-cutting roles</text>
  <text class="sub" x="880" y="244">never per-technology, so the fleet stays linear</text>
  <g class="f7"><rect class="card" x="740" y="262" width="280" height="52" rx="12"/><text class="name" x="760" y="284">Tessa</text><text class="role" x="760" y="304">validator · independent</text></g>
  <g class="f8"><rect class="card" x="740" y="322" width="280" height="52" rx="12"/><text class="name" x="760" y="344">Security reviewer</text><text class="role" x="760" y="364">read-only audit</text></g>
  <g class="f9"><rect class="card" x="740" y="382" width="280" height="52" rx="12"/><text class="name" x="760" y="404">Performance reviewer</text><text class="role" x="760" y="424">read-only audit</text></g>
  <g class="f10"><rect class="card" x="740" y="442" width="280" height="52" rx="12"/><text class="name" x="760" y="464">Doc writer</text><text class="role" x="760" y="484">changelog + guides</text></g>

  <!-- separation rule -->
  <text class="sub pulse" x="600" y="620">No actor validates their own work.</text>
</svg>

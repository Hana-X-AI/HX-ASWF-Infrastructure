<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="system-ui,'Segoe UI',sans-serif">
  <style>
    .bg{fill:#0a0f1a}
    .stage{fill:#111b2f;stroke:#243654;stroke-width:1.5}
    .stage-label{fill:#edf3ff;font-size:21px;font-weight:700;text-anchor:middle}
    .stage-sub{fill:#9aabc5;font-size:13px;text-anchor:middle}
    .edge{stroke:#243654;stroke-width:2;fill:none}
    .cp{fill:#0d1526;stroke:#55d6ff;stroke-width:1.6}
    .cp-text{fill:#55d6ff;font-size:12px;font-weight:600;text-anchor:middle}
    .gate{fill:#0d1526;stroke:#243654;stroke-width:1.4}
    .gate-label{fill:#c9d6ee;font-size:14px;font-weight:600}
    .gate-sub{fill:#9aabc5;font-size:12.5px}
    .title{fill:#edf3ff;font-size:26px;font-weight:700;text-anchor:middle}
    .pass{fill:#65e3a3}
    .block{fill:#ff7a8a}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .f0{animation:fade .5s ease both}
    .f1{animation:fade .5s ease .14s both}
    .f2{animation:fade .5s ease .28s both}
    .f3{animation:fade .5s ease .42s both}
    .f4{animation:fade .5s ease .56s both}
    .f5{animation:fade .5s ease .70s both}
    .f6{animation:fade .5s ease .84s both}
    .f7{animation:fade .5s ease .98s both}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes passdraw{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
    .p1{stroke-dasharray:120;animation:passdraw 1.2s ease 1s both}
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#243654"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560"/>
  <text class="title" x="600" y="46">Spec → change → deploy</text>
  <text class="stage-sub" text-anchor="middle" x="600" y="68">Three human checkpoints sit where a wrong assumption is cheapest to fix.</text>

  <!-- stages -->
  <g class="f0"><rect class="stage" x="90" y="110" width="220" height="84" rx="14"/><text class="stage-label" x="200" y="148">Spec</text><text class="stage-sub" x="200" y="170">problem + acceptance criteria</text></g>
  <g class="f2"><rect class="stage" x="490" y="110" width="220" height="84" rx="14"/><text class="stage-label" x="600" y="148">Change</text><text class="stage-sub" x="600" y="170">code + tests, one reason</text></g>
  <g class="f4"><rect class="stage" x="890" y="110" width="220" height="84" rx="14"/><text class="stage-label" x="1000" y="148">Deploy</text><text class="stage-sub" x="1000" y="170">merge + observe</text></g>

  <!-- edges with checkpoints -->
  <line class="edge" x1="310" y1="152" x2="484" y2="152" marker-end="url(#ah)"/>
  <line class="edge" x1="710" y1="152" x2="884" y2="152" marker-end="url(#ah)"/>
  <g class="f1"><rect class="cp" x="362" y="128" width="50" height="48" rx="10"/><text class="cp-text" x="387" y="148">CP1</text><text class="cp-text" x="387" y="164">story</text></g>
  <g class="f3"><rect class="cp" x="762" y="128" width="50" height="48" rx="10"/><text class="cp-text" x="787" y="148">CP2</text><text class="cp-text" x="787" y="164">brief</text></g>

  <!-- gates rail -->
  <text class="stage-sub" text-anchor="start" x="90" y="260">Gates that run on every change:</text>
  <g class="f5"><rect class="gate" x="90" y="278" width="240" height="64" rx="12"/><text class="gate-label" x="112" y="304">Path guard</text><text class="gate-sub" x="112" y="326">forbidden net + allow-list</text></g>
  <g class="f6"><rect class="gate" x="360" y="278" width="240" height="64" rx="12"/><text class="gate-label" x="382" y="304">Typecheck + tests</text><text class="gate-sub" x="382" y="326">deterministic, every commit</text></g>
  <g class="f7"><rect class="gate" x="630" y="278" width="240" height="64" rx="12"/><text class="gate-label" x="652" y="304">Independent validation</text><text class="gate-sub" x="652" y="326">Tessa, never self-validated</text></g>
  <g class="f7"><rect class="gate" x="900" y="278" width="210" height="64" rx="12"/><text class="gate-label" x="922" y="304">CP3 · PR review</text><text class="gate-sub" x="922" y="326">human accepts, then merge</text></g>

  <!-- result markers -->
  <text class="stage-sub" text-anchor="start" x="90" y="400">The gate answers one question each:</text>
  <g class="f7"><circle class="pass pulse" cx="120" cy="440" r="8"/><text class="gate-sub" x="140" y="445">pass → the change advances</text></g>
  <g class="f7"><circle class="block" cx="430" cy="440" r="8"/><text class="gate-sub" x="450" y="445">fail → the change routes back to its builder (max 3 loops)</text></g>

  <text class="stage-sub pulse" text-anchor="middle" x="600" y="520">A simple commit completes end to end, with no process failure.</text>
</svg>
